name: Wire Pokemon Randomizer

on:
  push:
    branches:
      - upcoming-decap
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire randomizer hooks
        run: python3 tools/wire_pokemon_randomizer.py

      - name: Commit wired hooks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src include
          if git diff --cached --quiet; then
            echo "No source changes were needed."
          else
            git commit -m "Wire save-seeded Pokemon randomizer"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Verify required hooks exist
        run: |
          grep -q 'PokemonRandomizer_GetSpecies(RANDOMIZER_DOMAIN_WILD' src/wild_encounter.c
          grep -q 'PokemonRandomizer_GetSpecies(RANDOMIZER_DOMAIN_STARTER' src/starter_choose.c
          grep -q 'PokemonRandomizer_RandomizeTrainerParty' src/battle_setup.c

      - name: Build Emerald
        run: make -j2 emerald
