name: Wire Pokemon Randomizer

on:
  push:
    branches:
      - feature/save-seeded-pokemon-randomizer

permissions:
  contents: write

jobs:
  wire-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout randomizer branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire randomizer hooks
        run: python3 tools/wire_pokemon_randomizer.py

      - name: Commit wired hooks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src include
          if git diff --cached --quiet; then
            echo "No source changes were needed."
          else
            git commit -m "Wire save-seeded Pokemon randomizer"
            git push origin HEAD:feature/save-seeded-pokemon-randomizer
          fi

      - name: Build Emerald
        run: make -j2 emerald
